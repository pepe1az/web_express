server {
    listen 9443 ssl;
    server_name 8517.simple-server.tech;
    ssl_certificate /etc/letsencrypt/live/8517.simple-server.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8517.simple-server.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/pepelaz-todo.access.log;
    error_log /var/log/nginx/pepelaz-todo.error.log;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
